<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Querer</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/bouquet.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/universo.css">
</head>
<body>

<noscript>
  <div class="noscript-fallback">
    Para ver el ramo animado, abre este archivo con un navegador (Chrome o Safari) en vez del visor de WhatsApp/Telegram — mantén presionado el archivo y elige "Abrir con".
  </div>
</noscript>

<nav id="nav-vistas" class="nav-vistas" aria-label="Navegación entre vistas">
  <button type="button" data-vista="ramo" class="activo" aria-pressed="true"><span class="icono">🌸</span><span class="label">Ramo</span></button>
  <button type="button" data-vista="universo" aria-pressed="false"><span class="icono">🪐</span><span class="label">Universo</span></button>
</nav>

<section id="vista-ramo" class="vista" data-vista="ramo">
<div class="stage" id="stage">
  <div class="titulo">Para mi Gordita
    <span class="linea l1">no hay flor que alcance para decirte cuánto te quiero,</span>
    <span class="linea l2">así que te traje un ramo entero.</span>
    <span class="linea l3">rosas, tulipanes, lirios, amapolas y narcisos, todos para ti.</span>
    <span class="firma">con todo mi corazón ♡</span>
  </div>

  <div class="ramo" id="ramo">
    <!-- flowers, leaves, grass and stems injected by js/bouquet.js -->
  </div>

  <div class="toca">toca la pantalla</div>
</div>
</section>

<section id="vista-universo" class="vista vista--desmontada" data-vista="universo">
  <div id="universo-canvas-mount"></div>
</section>

<script src="js/utilities.js"></script>
<script src="js/bouquet.js"></script>
<script src="js/animations.js"></script>
<script src="js/particles.js"></script>
<script src="js/interactions.js"></script>
<script src="js/app.js"></script>

<script src="assets/vendor/three.min.js"></script>
<script src="js/universo/constants.js"></script>
<script src="js/universo/scene.js"></script>
<script src="js/universo/glow.js"></script>
<script src="js/universo/starfield.js"></script>
<script src="js/universo/planet.js"></script>
<script src="js/universo/rings.js"></script>
<script src="js/universo/heart.js"></script>
<script src="js/universo/controls.js"></script>
<script src="js/universo/app.js"></script>
<script src="js/nav.js"></script>
</body>
</html>
